<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Koeienvlaai Locator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>Koeienvlaai Locator</h1>

  <!-- Veldafmetingen -->
  <div class="card">
    <div class="card-title">Veldafmetingen</div>
    <div class="grid-2">
      <div class="field">
        <label>Kant van straat — Lengte X (m)</label>
        <input type="number" id="lengte" value="50" min="0.1" step="any">
      </div>
      <div class="field">
        <label>Kant van parking — Breedte Y (m)</label>
        <input type="number" id="breedte" value="60" min="0.1" step="any">
      </div>
    </div>
    <hr class="sep">
    <div class="grid-2" style="max-width:300px">
      <div class="field">
        <label>Kolommen (X-richting)</label>
        <input type="number" id="numCols" value="50" min="1" step="1">
      </div>
      <div class="field">
        <label>Rijen (Y-richting)</label>
        <input type="number" id="numRows" value="40" min="1" step="1">
      </div>
    </div>
  </div>

  <!-- Metingen -->
  <div class="card">
    <div class="card-title">Metingen</div>
    <div class="grid-4">
      <div class="field">
        <div class="badge badge-a">Meting A</div>
        <label>Hoek</label>
        <select id="hoekA">
          <option value="1">Hoek 1 — links-boven</option>
          <option value="2">Hoek 2 — rechts-boven</option>
          <option value="3">Hoek 3 — links-onder</option>
          <option value="4">Hoek 4 — rechts-onder</option>
        </select>
      </div>
      <div class="field" style="justify-content:flex-end">
        <label>Afstand A (m)</label>
        <input type="number" id="afstandA" value="35" min="0" step="any">
      </div>
      <div class="field">
        <div class="badge badge-b">Meting B</div>
        <label>Hoek</label>
        <select id="hoekB">
          <option value="1">Hoek 1 — links-boven</option>
          <option value="2" selected>Hoek 2 — rechts-boven</option>
          <option value="3">Hoek 3 — links-onder</option>
          <option value="4">Hoek 4 — rechts-onder</option>
        </select>
      </div>
      <div class="field" style="justify-content:flex-end">
        <label>Afstand B (m)</label>
        <input type="number" id="afstandB" value="28" min="0" step="any">
      </div>
    </div>
    <hr class="sep">
    <div style="font-size:.7rem;color:#64748b;margin-bottom:.75rem">
      Meting C — optioneel, alleen nodig bij ambiguïteit (beide snijpunten binnen veld)
    </div>
    <div class="grid-4">
      <div class="field">
        <div class="badge badge-c">Meting C</div>
        <label>Hoek</label>
        <select id="hoekC">
          <option value="1">Hoek 1 — links-boven</option>
          <option value="2">Hoek 2 — rechts-boven</option>
          <option value="3" selected>Hoek 3 — links-onder</option>
          <option value="4">Hoek 4 — rechts-onder</option>
        </select>
      </div>
      <div class="field" style="justify-content:flex-end">
        <label>Afstand C (m)</label>
        <input type="number" id="afstandC" placeholder="leeg = niet gebruiken" min="0" step="any">
      </div>
      <div></div>
      <div></div>
    </div>
  </div>

  <!-- Uitgesloten vakjes -->
  <div class="card">
    <div class="card-title">Uitgesloten vakjes voor de Lucky Loser Prijs</div>
    <div class="field">
      <label>Vakjes gereserveerd door organisatie — doen niet mee aan winnaar of lucky loser (kommagescheiden)</label>
      <input type="text" id="uitgesloten" placeholder="bv. 5, 12, 47, 103">
    </div>
  </div>

  <button id="calcBtn" onclick="calculate()">Bereken &amp; Visualiseer</button>

  <!-- Resultaat + veldtekening -->
  <div class="card" id="output-card" style="display:none">
    <div class="canvas-wrapper">
      <canvas id="fieldCanvas"></canvas>
    </div>
    <div id="result-text"></div>
  </div>

  <!-- Volledig raster -->
  <div class="card" id="full-grid-card" style="display:none">
    <div class="card-title">Volledig raster</div>
    <div id="full-grid-scroll" style="overflow:auto;max-height:520px;border-radius:6px;background:#080f1a;cursor:grab">
      <canvas id="fullGridCanvas" style="display:block"></canvas>
    </div>
    <div style="margin-top:.6rem;display:flex;gap:1rem;align-items:center;flex-wrap:wrap">
      <div class="legend-items">
        <span class="leg-swatch" style="background:rgba(34,197,94,0.4);border:2px solid #22c55e"></span> Winnaar
        <span class="leg-swatch" style="background:rgba(245,158,11,0.4);border:2px solid #f59e0b;margin-left:.5rem"></span> Lucky loser
        <span class="leg-swatch" style="background:rgba(234,179,8,0.3);border:1px dashed #f59e0b;margin-left:.5rem"></span> Buurvakjes winnaar
        <span class="leg-swatch" style="background:rgba(239,68,68,0.2);border:1px solid rgba(239,68,68,0.5);margin-left:.5rem"></span> Uitgesloten
      </div>
      <button onclick="scrollToWinner()" class="btn-small">&#8982; Scroll naar winnaar</button>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
